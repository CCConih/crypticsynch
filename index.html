<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rain-bg: #000000;
    --rain: #00ffff;
    --rain-head: #ffffff;
    --tag: #d6ffff;
    --tag-on: #00ffff;
    --blue: #0000fe;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rain-bg: #000000; } }
  :root[data-theme="dark"] { --rain-bg: #000000; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--rain-bg);
    touch-action: none;
    cursor: crosshair;
  }

  /* ---------- Hidden layer: black, with text scattered on it ---------- */
  .scene {
    position: fixed;
    inset: 0;
    background: #000;
  }
  .tag {
    position: absolute;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    font-weight: 500;
    font-size: clamp(0.8rem, 1.25vw, 1.05rem);
    letter-spacing: 0.04em;
    color: var(--tag);
    white-space: nowrap;
    padding: 0.5em 0.7em;            /* bigger hover target than the text itself */
    user-select: none;
    transition: color .2s ease, text-shadow .2s ease;
  }
  .tag::before {
    content: "";
    display: inline-block;
    width: 0.55em;
    height: 0.55em;
    margin-right: 0.6em;
    border: 1px solid currentColor;
    vertical-align: 0.05em;
  }
  .tag.playing {
    color: var(--tag-on);
    text-shadow: 0 0 10px rgba(0,255,255,.7), 0 0 24px rgba(0,0,254,.8);
    animation: tag-glitch 1.6s steps(1) infinite;
  }
  .tag.playing::before {
    background: currentColor;
    animation: blink .5s steps(1) infinite;
  }
  @keyframes tag-glitch {
    0%   { transform: none; }
    40%  { transform: translateX(2px); text-shadow: -2px 0 #ff1430, 2px 0 #0000fe; }
    42%  { transform: translateX(-3px) skewX(-8deg); }
    44%  { transform: none; }
    80%  { transform: translateX(1px); text-shadow: 2px 0 #3b00d8, -1px 0 #00ffff; }
    81%  { transform: none; }
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .tag.playing, .tag.playing::before { animation: none; }
  }

  /* ---------- Binary rain, with a hole cut by the mask ---------- */
  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    --x: 50%;
    --y: 50%;
    --r: 0px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), transparent 0%, transparent 45%, #000 100%);
    mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), transparent 0%, transparent 45%, #000 100%);
  }


  /* ---------- Logo: always on top, never masked ---------- */
  .logo {
    position: fixed;
    left: 50%;
    top: 50%;
    width: clamp(170px, 40vmin, 360px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: 1000;                    /* above rain and spotlight */
    pointer-events: none;
    isolation: isolate;
    filter: drop-shadow(0 0 22px rgba(70, 110, 255, .35));
    animation: jitter 3.7s steps(1) infinite;
  }
  .logo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .logo .base { animation: flicker 5.3s steps(1) infinite; }
  .logo .r {
    filter: hue-rotate(120deg) saturate(2.2);
    opacity: 0;
    animation: slice-r 2.9s steps(1) infinite;
  }
  .logo .g {
    filter: hue-rotate(-100deg) saturate(2);
    opacity: 0;
    animation: slice-g 3.4s steps(1) infinite;
  }

  @keyframes jitter {
    0%   { transform: translate(-50%, -50%); }
    46%  { transform: translate(calc(-50% + 4px), -50%) skewX(5deg); }
    47%  { transform: translate(calc(-50% - 5px), calc(-50% + 1px)); }
    48%  { transform: translate(-50%, -50%); }
    82%  { transform: translate(calc(-50% - 2px), -50%) scale(1.04) skewX(-7deg); }
    83%  { transform: translate(calc(-50% + 3px), calc(-50% - 2px)) scale(.98); }
    84%  { transform: translate(-50%, -50%); }
  }
  @keyframes flicker {
    0%  { opacity: 1; }
    35% { opacity: .5; }
    36% { opacity: 1; }
    71% { opacity: .2; }
    72% { opacity: 1; }
    73% { opacity: .65; }
    74% { opacity: 1; }
  }
  @keyframes slice-r {
    0%   { opacity: 0; clip-path: inset(0 0 100% 0); transform: none; }
    20%  { opacity: .9; clip-path: inset(18% 0 66% 0); transform: translate(-9px, 0); }
    21%  { opacity: .9; clip-path: inset(60% 0 24% 0); transform: translate(7px, 0); }
    22%  { opacity: 0; }
    62%  { opacity: .9; clip-path: inset(10% 0 74% 0); transform: translate(-6px, 0); }
    64%  { opacity: .9; clip-path: inset(48% 0 34% 0); transform: translate(12px, 1px); }
    66%  { opacity: .9; clip-path: inset(30% 0 55% 0); transform: translate(-4px, 0); }
    68%  { opacity: .9; clip-path: inset(78% 0 6% 0);  transform: translate(8px, 0); }
    70%  { opacity: 0; clip-path: inset(0 0 100% 0); transform: none; }
  }
  @keyframes slice-g {
    0%   { opacity: 0; clip-path: inset(0 0 100% 0); transform: none; }
    38%  { opacity: .8; clip-path: inset(40% 0 45% 0); transform: translate(10px, 0); }
    39%  { opacity: .8; clip-path: inset(70% 0 12% 0); transform: translate(-7px, 0); }
    40%  { opacity: 0; }
    63%  { opacity: .8; clip-path: inset(25% 0 60% 0); transform: translate(6px, -1px); }
    65%  { opacity: .8; clip-path: inset(5% 0 85% 0);  transform: translate(-11px, 0); }
    67%  { opacity: .8; clip-path: inset(56% 0 28% 0); transform: translate(5px, 0); }
    69%  { opacity: 0; clip-path: inset(0 0 100% 0); transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .logo img { animation: none; }
    .logo .r, .logo .g { display: none; }
  }
</style>
</head>

<script>
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = window.matchMedia('(pointer: coarse)').matches;

  // Palette sampled from the logo: electric blue, cyan, violet, white, plus the red specks
  const BG = '#000000';
  const FADE = 'rgba(0, 0, 6, 0.09)';   // blue-tinted fade so trails stay blue, not grey
  const PALETTE = [
    { c: '#0000fe', h: '#9a9aff', w: 40 },   // electric blue (logo body)
    { c: '#00ffff', h: '#d6ffff', w: 28 },   // cyan
    { c: '#3b00d8', h: '#b9a0ff', w: 18 },   // violet
    { c: '#00ffe3', h: '#ccfff8', w: 8 },    // aqua
    { c: '#ff1430', h: '#ffa3ad', w: 4 },    // red specks
    { c: '#ffffff', h: '#ffffff', w: 2 },    // white
  ];
  const TOTAL_W = PALETTE.reduce((a, p) => a + p.w, 0);
  function pickColor() {
    let r = Math.random() * TOTAL_W;
    for (const p of PALETTE) { if ((r -= p.w) < 0) return p; }
    return PALETTE[0];
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0, dpr = 1, fontSize = 16, cols = 0;
  let drops = [], speeds = [], colors = [], offsets = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fontSize = W < 600 ? 14 : 18;
    cols = Math.ceil(W / fontSize);
    drops = Array.from({ length: cols }, () => Math.random() * -H / fontSize);
    speeds = Array.from({ length: cols }, () => rand(0.55, 1.15));
    colors = Array.from({ length: cols }, () => pickColor());
    offsets = Array.from({ length: cols }, () => Math.floor(Math.random() * DATE.length));
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    if (reduceMotion) drawStatic();
  }

  const bit = () => (Math.random() < 0.5 ? '0' : '1');
  const DATE = '171026';   // 17 10 26
  const dateChar = (row) => DATE[((row % DATE.length) + DATE.length) % DATE.length];

  // ---------- Glitch effects ----------
  // Slide a horizontal band of the canvas sideways (screen-tear)
  function tear(maxShift) {
    const y = rand(0, H);
    const h = rand(3, 38);
    const dx = rand(-maxShift, maxShift);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(canvas, 0, y * dpr, canvas.width, h * dpr, dx * dpr, y * dpr, canvas.width, h * dpr);
    ctx.restore();
  }
  // Thin horizontal scan streaks, like the lines inside the logo
  function streak() {
    ctx.fillStyle = pickColor().c;
    const y = Math.floor(rand(0, H));
    ctx.globalAlpha = rand(0.4, 0.9);
    ctx.fillRect(rand(-50, W), y, rand(20, 220), Math.random() < 0.7 ? 1 : 2);
    ctx.globalAlpha = 1;
  }
  // RGB-split: copy the frame back onto itself offset, additively
  function chromaSplit(offset) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    ctx.drawImage(canvas, offset * dpr, 0);
    ctx.restore();
  }

  let burstFrames = 0;
  let nextBurst = performance.now() + rand(1500, 3500);

  function step(now) {
    // fade previous frame to leave trails
    ctx.fillStyle = FADE;
    ctx.fillRect(0, 0, W, H);
    ctx.font = `700 ${fontSize}px 'JetBrains Mono', ui-monospace, monospace`;
    ctx.textBaseline = 'top';

    if (now >= nextBurst) {
      burstFrames = Math.floor(rand(4, 10));
      nextBurst = now + rand(1800, 5000);
    }
    const bursting = burstFrames > 0;

    for (let i = 0; i < cols; i++) {
      // small sideways jitter on a few characters (lots more during a burst)
      const jitter = Math.random() < (bursting ? 0.15 : 0.02) ? rand(-fontSize, fontSize) * 0.6 : 0;
      const x = i * fontSize + jitter;
      const row = Math.floor(drops[i]) + offsets[i];
      const y = Math.floor(drops[i]) * fontSize;

      const col = bursting && Math.random() < 0.2 ? pickColor() : colors[i];
      ctx.fillStyle = col.c;
      ctx.fillText(dateChar(row - 1), x, y - fontSize);
      ctx.fillText(dateChar(row - 2), x, y - fontSize * 2);
      ctx.fillStyle = col.h;
      ctx.fillText(dateChar(row), x, y);
      drops[i] += speeds[i];
      if (y > H && Math.random() > 0.975) {
        drops[i] = Math.random() * -20;
        speeds[i] = rand(0.55, 1.15);
        colors[i] = pickColor();
      }
    }

    // ambient glitch: occasional tears and streaks
    if (Math.random() < 0.07) tear(40);
    if (Math.random() < 0.25) streak();

    // burst: heavy tearing, color split, column color swaps, sometimes a frozen skip
    if (bursting) {
      const n = Math.floor(rand(2, 6));
      for (let k = 0; k < n; k++) tear(120);
      for (let k = 0; k < 6; k++) streak();
      if (Math.random() < 0.5) chromaSplit(rand(-8, 8));
      if (Math.random() < 0.3) colors[Math.floor(rand(0, cols))] = pickColor();
      burstFrames--;
    }
  }

  function drawStatic() {
    ctx.font = `500 ${fontSize}px 'JetBrains Mono', ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    for (let x = 0; x < W; x += fontSize) {
      for (let y = 0; y < H; y += fontSize) {
        ctx.globalAlpha = 0.2 + Math.random() * 0.5;
        ctx.fillStyle = pickColor().c;
        ctx.fillText(bit(), x, y);
      }
    }
    ctx.globalAlpha = 1;
  }

  ];
  const FADE_MS = 350;           // fade in / out time
  const STOP_ON_LEAVE = true;    // false = keep playing until another text is hovered

  // ---------- Place the texts at random spots (avoiding the logo and each other) ----------
  const scene = document.getElementById('scene');
  const tags = ITEMS.map((item, i) => {
    const el = document.createElement('div');
    el.className = 'tag';
    el.textContent = item.text;
    el.dataset.index = i;
    scene.appendChild(el);
    return el;
  });

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // New random layout on every refresh. Each text keeps at least `gap` px of
  // empty space around it (from the logo and from every other text).
  function placeTags() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const logoSize = Math.min(Math.max(170, Math.min(vw, vh) * 0.40), 360);
    const edge = 16;
    const hit = (a, b, g) => a.x - g < b.x + b.w && a.x + a.w + g > b.x && a.y - g < b.y + b.h && a.y + a.h + g > b.y;
    const order = shuffle(tags.slice());

    let gap = Math.max(48, Math.min(vw, vh) * 0.12);
    for (let attempt = 0; attempt < 8; attempt++) {
      const placed = [{ x: vw / 2 - logoSize / 2, y: vh / 2 - logoSize / 2, w: logoSize, h: logoSize }];
      const boxes = [];
      let ok = true;
      for (const el of order) {
        const w = el.offsetWidth, h = el.offsetHeight;
        let found = null;
        for (let t = 0; t < 500 && !found; t++) {
          const cand = {
            x: edge + Math.random() * Math.max(1, vw - w - edge * 2),
            y: edge + Math.random() * Math.max(1, vh - h - edge * 2),
            w, h,
          };
          if (!placed.some((p) => hit(cand, p, gap))) found = cand;
        }
        if (!found) { ok = false; break; }
        placed.push(found);
        boxes.push([el, found]);
      }
      if (ok) {
        boxes.forEach(([el, box]) => {
          el.style.left = (box.x / vw * 100) + '%';
          el.style.top = (box.y / vh * 100) + '%';
        });
        return;
      }
      gap *= 0.8; // screen too small for this spacing: loosen it a little and retry
    }
  }

  // ---------- Audio players ----------
  let actx = null;
  function demoPlayer(i) {
    const scale = [220, 246.94, 277.18, 329.63, 369.99, 440, 493.88, 554.37];
    const f = scale[i % scale.length];
    let nodes = null;
    return {
      play() {
        if (!actx) return;
        if (!nodes) {
          const g = actx.createGain(); g.gain.value = 0;
          const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
          const o1 = actx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
          const o2 = actx.createOscillator(); o2.type = 'square'; o2.frequency.value = f * 1.5; o2.detune.value = 8;
          const lfo = actx.createOscillator(); lfo.frequency.value = 6;
          const lfoGain = actx.createGain(); lfoGain.gain.value = 400;
          lfo.connect(lfoGain).connect(lp.frequency);
          o1.connect(lp); o2.connect(lp); lp.connect(g).connect(actx.destination);
          o1.start(); o2.start(); lfo.start();
          nodes = { g, stop: () => { o1.stop(); o2.stop(); lfo.stop(); } };
        }
        const now = actx.currentTime;
        nodes.g.gain.cancelScheduledValues(now);
        nodes.g.gain.setTargetAtTime(0.12, now, FADE_MS / 3000);
      },
      stop() {
        if (!nodes) return;
        const now = actx.currentTime;
        nodes.g.gain.cancelScheduledValues(now);
        nodes.g.gain.setTargetAtTime(0, now, FADE_MS / 3000);
      },
      prime() {},
    };
  }

  function fade(from, to, ms, set, done) {
    const t0 = performance.now();
    let id;
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      set(from + (to - from) * k);
      if (k < 1) id = requestAnimationFrame(tick); else if (done) done();
    };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }

  function filePlayer(src) {
    const el = new Audio(src);
    el.preload = 'auto';
    el.loop = true;
    el.volume = 0;
    let cancel = () => {};
    return {
      play() {
        cancel();
        el.play().catch(() => {});
        cancel = fade(el.volume, 1, FADE_MS, (v) => { el.volume = v; });
      },
      stop() {
        cancel();
        cancel = fade(el.volume, 0, FADE_MS, (v) => { el.volume = v; }, () => el.pause());
      },
      prime() {   // iOS needs each audio element touched once inside a tap
        el.muted = true;
        el.play().then(() => { el.pause(); el.muted = false; }).catch(() => { el.muted = false; });
      },
    };
  }

  let scApi = null;
  function loadSoundCloudApi() {
    if (!scApi) {
      scApi = new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'https://w.soundcloud.com/player/api.js';
        sc.onload = () => resolve(window.SC);
        sc.onerror = reject;
        document.head.appendChild(sc);
      });
    }
    return scApi;
  }
  function soundCloudPlayer(url) {
    const iframe = document.createElement('iframe');
    iframe.allow = 'autoplay';
    iframe.title = 'SoundCloud player';
    iframe.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;border:0;';
    iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&auto_play=false&buying=false&sharing=false&download=false&show_artwork=false';
    document.body.appendChild(iframe);
    let widget = null, ready = false, wantPlay = false, vol = 0, cancel = () => {};
    loadSoundCloudApi().then((SC) => {
      widget = SC.Widget(iframe);
      widget.bind(SC.Widget.Events.READY, () => {
        ready = true;
        widget.setVolume(0);
        if (wantPlay) api.play();
      });
      widget.bind(SC.Widget.Events.FINISH, () => { if (wantPlay) { widget.seekTo(0); widget.play(); } });
    }).catch(() => console.warn('SoundCloud API failed to load'));
    const api = {
      play() {
        wantPlay = true;
        if (!ready) return;
        cancel();
        widget.play();
        cancel = fade(vol, 100, FADE_MS, (v) => { vol = v; widget.setVolume(v); });
      },
      stop() {
        wantPlay = false;
        if (!ready) return;
        cancel();
        cancel = fade(vol, 0, FADE_MS, (v) => { vol = v; widget.setVolume(v); }, () => widget.pause());
      },
      prime() {},
    };
    return api;
  }

  const players = ITEMS.map((item, i) => {
    if (!item.src) return demoPlayer(i);
    if (/soundcloud\.com/i.test(item.src)) return soundCloudPlayer(item.src);
    return filePlayer(item.src);
  });

  // ---------- Sound unlock (browsers block audio until the first click/tap) ----------
  let unlocked = false;
  const soundOn = true;
  let activeIndex = -1;

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
    } catch (e) {}
    players.forEach((p) => p.prime());
    if (activeIndex >= 0 && soundOn) players[activeIndex].play();
  }
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);

  function setActive(index) {
    if (index === activeIndex) return;
    if (activeIndex >= 0) {
      if (STOP_ON_LEAVE || index >= 0) {
        players[activeIndex].stop();
        tags[activeIndex].classList.remove('playing');
      } else {
        return; // keep the last one playing
      }
    }
    activeIndex = index;
    if (index >= 0) {
      tags[index].classList.add('playing');
      if (unlocked && soundOn) players[index].play();
    }
  }

  // hit-test under the pointer (works for mouse hover and finger drag)
  function checkHover(x, y) {
    const el = document.elementFromPoint(x, y);
    const tag = el && el.closest ? el.closest('.tag') : null;
    setActive(tag ? Number(tag.dataset.index) : -1);
  }

  // ---------- Spotlight follow (eased) ----------
  const target = { x: window.innerWidth / 2, y: window.innerHeight / 2, r: 0 };
  const light = { x: target.x, y: target.y, r: 0 };
  const baseRadius = () => Math.min(320, Math.max(150, Math.min(W, H) * 0.32));
  let interacted = false;

  function onMove(e) {
    target.x = e.clientX;
    target.y = e.clientY;
    target.r = baseRadius();
    if (!interacted) interacted = true;
    checkHover(e.clientX, e.clientY);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerdown', onMove);
  document.documentElement.addEventListener('pointerleave', () => { target.r = 0; setActive(-1); });
  window.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') { target.r = 0; setActive(-1); } });
  window.addEventListener('pointercancel', () => { target.r = 0; setActive(-1); });

  // A small glow at the center on load, so people know something is under there
  setTimeout(() => { if (!interacted) target.r = baseRadius() * 0.55; }, 500);

  function updateLight() {
    const ease = reduceMotion ? 1 : 0.18;
    light.x += (target.x - light.x) * ease;
    light.y += (target.y - light.y) * ease;
    light.r += (target.r - light.r) * (reduceMotion ? 1 : 0.12);
    canvas.style.setProperty('--x', light.x + 'px');
    canvas.style.setProperty('--y', light.y + 'px');
    canvas.style.setProperty('--r', light.r.toFixed(1) + 'px');
  }

  // ---------- Loop: rain at ~30fps (the classic choppy feel), light at full rate ----------
  let last = 0;
  const RAIN_INTERVAL = 1000 / 30;
  function loop(t) {
    if (!reduceMotion && t - last >= RAIN_INTERVAL) {
      step(t);
      last = t;
    }
    updateLight();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeTags); else placeTags();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
